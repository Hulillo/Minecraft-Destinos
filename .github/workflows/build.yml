name: Compilar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"  # Loom 1.18 necesita Java 25 para ejecutarse; el mod se sigue compilando para Java 21 (release = 21)

      - uses: gradle/actions/setup-gradle@v4

      - name: Generar el datapack (suelto y variante del mod)
        run: |
          pip install pillow
          python datapack/build.py salida --mod destinos-core/src/main/generated

      - name: Comprobar que el datapack calcula lo mismo que el simulador
        run: python herramientas/verifica.py salida/destinos_reinos

      - name: Comprobar que Geo.java calcula lo mismo que el simulador
        run: |
          python herramientas/casos.py casos.txt
          mkdir -p prueba
          javac -d prueba destinos-core/src/main/java/es/hulillo/destinos/Geo.java herramientas/PruebaGeo.java
          java -cp prueba PruebaGeo casos.txt

      - name: Simular 25 años de política viva (reproducible, sin caos)
        run: |
          mkdir -p prueba-politica
          javac -d prueba-politica -sourcepath destinos-core/src/main/java destinos-core/src/main/java/es/hulillo/destinos/politica/*.java herramientas/PruebaPolitica.java
          java -cp prueba-politica PruebaPolitica

      - name: Probar que guardar y cargar la política (y la gente) no pierde nada
        run: |
          mkdir -p prueba-guardado
          javac -d prueba-guardado -sourcepath destinos-core/src/main/java herramientas/nbt-falso/*.java herramientas/PruebaPolitica.java destinos-core/src/main/java/es/hulillo/destinos/GuardadoPolitica.java
          java -cp prueba-guardado es.hulillo.destinos.PruebaGuardado

      - name: Compilar Destinos Core
        working-directory: destinos-core
        run: ./gradlew build --no-daemon

      - name: Sonda temporal (render en 1.21.11 y 3D Skin Layers con nombres de Mojang)
        continue-on-error: true
        run: |
          find ~/.gradle destinos-core/.gradle -name '*.jar' 2>/dev/null | grep -iE 'skinlayers|minecraft-merged|minecraft-client|clientonly' | head -20
          MC=$(find ~/.gradle destinos-core/.gradle -name '*.jar' 2>/dev/null | grep -iE 'minecraft-(merged|client|clientOnly)' | grep -v sources | head -1)
          SL=$(find ~/.gradle destinos-core/.gradle -name '*.jar' 2>/dev/null | grep -i skinlayers | grep -v sources | head -1)
          echo "MC=$MC SL=$SL"
          for c in net.minecraft.client.renderer.SubmitNodeCollector 'net.minecraft.client.renderer.SubmitNodeCollector$CustomGeometryRenderer' net.minecraft.client.renderer.OrderedSubmitNodeCollector net.minecraft.client.renderer.entity.layers.RenderLayer 'com.mojang.blaze3d.vertex.PoseStack$Pose' com.mojang.blaze3d.vertex.PoseStack net.minecraft.client.renderer.rendertype.RenderTypes net.minecraft.client.renderer.RenderType; do javap -cp "$MC" "$c" 2>&1 | head -60; done
          mkdir sl && cd sl && unzip -q "$SL"
          for c in dev.tr7zw.skinlayers.api.Mesh dev.tr7zw.skinlayers.api.MeshHelper dev.tr7zw.skinlayers.api.OffsetProvider; do javap -cp . "$c"; done
          ls dev/tr7zw/skinlayers/mixin
          javap -c -p -cp . dev.tr7zw.skinlayers.mixin.PlayerRendererMixin | grep -E 'invoke|Method|public|private' | head -120
          javap -c -p -cp . dev.tr7zw.skinlayers.SkinUtil | grep -E 'invoke|ldc|bipush|iconst|fconst|sipush' | head -120

      - name: Arrancar un servidor de Minecraft con el mod y comprobar que el datapack carga sin errores
        run: python herramientas/servidor_prueba.py
        timeout-minutes: 20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: destinos-core
          path: |
            destinos-core/build/libs/*.jar
            salida/*.zip
            destinos-core/run/logs/latest.log
