name: Compilar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"  # Loom 1.18 necesita Java 25 para ejecutarse; el mod se sigue compilando para Java 21 (release = 21)

      - uses: gradle/actions/setup-gradle@v4

      - name: Generar el datapack (suelto y variante del mod)
        run: |
          pip install pillow
          python datapack/build.py salida --mod destinos-core/src/main/generated

      - name: Comprobar que el datapack calcula lo mismo que el simulador
        run: python herramientas/verifica.py salida/destinos_reinos

      - name: Comprobar que Geo.java calcula lo mismo que el simulador
        run: |
          python herramientas/casos.py casos.txt
          mkdir -p prueba
          javac -d prueba destinos-core/src/main/java/es/hulillo/destinos/Geo.java herramientas/PruebaGeo.java
          java -cp prueba PruebaGeo casos.txt

      - name: Simular 25 años de política viva (reproducible, sin caos)
        run: |
          mkdir -p prueba-politica
          javac -d prueba-politica -sourcepath destinos-core/src/main/java destinos-core/src/main/java/es/hulillo/destinos/politica/*.java herramientas/PruebaPolitica.java
          java -cp prueba-politica PruebaPolitica

      - name: Probar que guardar y cargar la política (y la gente) no pierde nada
        run: |
          mkdir -p prueba-guardado
          javac -d prueba-guardado -sourcepath destinos-core/src/main/java herramientas/nbt-falso/*.java herramientas/PruebaPolitica.java destinos-core/src/main/java/es/hulillo/destinos/GuardadoPolitica.java
          java -cp prueba-guardado es.hulillo.destinos.PruebaGuardado

      - name: Compilar Destinos Core
        working-directory: destinos-core
        run: ./gradlew build --no-daemon

      - name: Sonda temporal (3D Skin Layers con nombres de Mojang)
        continue-on-error: true
        run: |
          MC=$(find destinos-core/.gradle/loom-cache/minecraftMaven -name 'minecraft-merged-*.jar' | grep -v sources | head -1)
          SL=$(find destinos-core/.gradle/loom-cache/remapped_mods -name '3dskinlayers*.jar' | head -1)
          echo "MC=$MC SL=$SL"
          mkdir sl && cd sl && unzip -q "$SL" && cd ..
          javap -cp sl dev.tr7zw.skinlayers.accessor.ModelPartInjector
          javap -p -cp sl dev.tr7zw.skinlayers.api.Mesh dev.tr7zw.skinlayers.api.MeshHelper dev.tr7zw.skinlayers.api.OffsetProvider dev.tr7zw.skinlayers.mixin.ModelPartMixin dev.tr7zw.skinlayers.mixin.PlayerModelMixin dev.tr7zw.skinlayers.mixin.PlayerRendererMixin
          javap -c -p -cp sl dev.tr7zw.skinlayers.mixin.ModelPartMixin | grep -E 'invoke|getfield|Method|private|public|ifeq|ifne' | head -150
          javap -c -p -cp sl dev.tr7zw.skinlayers.mixin.PlayerRendererMixin | grep -E 'invoke|Method|private|public' | head -80
          javap -c -p -cp sl dev.tr7zw.skinlayers.mixin.PlayerModelMixin | grep -E 'invoke|Method|private|public' | head -60
          cat sl/skinlayers3d.mixins.json
          javap -cp "$MC" net.minecraft.client.model.geom.ModelPart net.minecraft.client.model.HumanoidModel net.minecraft.client.model.Model 2>&1 | head -120

      - name: Arrancar un servidor de Minecraft con el mod y comprobar que el datapack carga sin errores
        run: python herramientas/servidor_prueba.py
        timeout-minutes: 20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: destinos-core
          path: |
            destinos-core/build/libs/*.jar
            salida/*.zip
            destinos-core/run/logs/latest.log
