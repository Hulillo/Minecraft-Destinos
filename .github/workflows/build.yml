name: Compilar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"  # Loom 1.18 necesita Java 25 para ejecutarse; el mod se sigue compilando para Java 21 (release = 21)

      - uses: gradle/actions/setup-gradle@v4

      - name: Generar el datapack (suelto y variante del mod)
        run: |
          pip install pillow
          python datapack/build.py salida --mod destinos-core/src/main/generated

      - name: Comprobar que el datapack calcula lo mismo que el simulador
        run: python herramientas/verifica.py salida/destinos_reinos

      - name: Comprobar que Geo.java calcula lo mismo que el simulador
        run: |
          python herramientas/casos.py casos.txt
          mkdir -p prueba
          javac -d prueba destinos-core/src/main/java/es/hulillo/destinos/Geo.java herramientas/PruebaGeo.java
          java -cp prueba PruebaGeo casos.txt

      - name: Simular 25 años de política viva (reproducible, sin caos)
        run: |
          mkdir -p prueba-politica
          javac -d prueba-politica -sourcepath destinos-core/src/main/java destinos-core/src/main/java/es/hulillo/destinos/politica/*.java herramientas/PruebaPolitica.java
          java -cp prueba-politica PruebaPolitica

      - name: Probar que guardar y cargar la política (y la gente) no pierde nada
        run: |
          mkdir -p prueba-guardado
          javac -d prueba-guardado -sourcepath destinos-core/src/main/java herramientas/nbt-falso/*.java herramientas/PruebaPolitica.java destinos-core/src/main/java/es/hulillo/destinos/GuardadoPolitica.java
          java -cp prueba-guardado es.hulillo.destinos.PruebaGuardado

      - name: Sonda temporal (API de 3D Skin Layers)
        continue-on-error: true
        run: |
          curl -s 'https://api.modrinth.com/v2/project/zV5r3pPn/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D' > v.json || true
          python -c "import json;d=json.load(open('v.json'));[print('VERSION',v['version_number'],v['files'][0]['url']) for v in d[:3]]"
          URL=$(python -c "import json;print(json.load(open('v.json'))[0]['files'][0]['url'])")
          curl -sL "$URL" -o capas.jar
          unzip -l capas.jar | grep -iE 'api|mesh' | head -60
          mkdir capas && cd capas && unzip -q ../capas.jar
          for c in $(find . -path '*api*' -name '*.class' | head -30); do javap -cp . "${c%.class}"; done
          javap -cp . $(find . -name 'MeshHelper*.class' -o -name 'Mesh.class' -o -name 'SkinLayersAPI*.class' | sed 's/\.class$//' | head -10) || true
          javap -cp . $(find . -name '*SkinUtil*.class' -o -name '*PlayerSettings*.class' | sed 's/\.class$//' | head -6) || true
          cat fabric.mod.json

      - name: Compilar Destinos Core
        working-directory: destinos-core
        run: ./gradlew build --no-daemon

      - name: Arrancar un servidor de Minecraft con el mod y comprobar que el datapack carga sin errores
        run: python herramientas/servidor_prueba.py
        timeout-minutes: 20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: destinos-core
          path: |
            destinos-core/build/libs/*.jar
            salida/*.zip
            destinos-core/run/logs/latest.log
