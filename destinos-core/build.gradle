plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

// En la CI se añade el número de compilación (0.3.0+build.57) para distinguir un jar de otro
version = System.getenv("GITHUB_RUN_NUMBER") ? "${project.version}+build.${System.getenv("GITHUB_RUN_NUMBER")}" : project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Solo para compilar los enchufes de mapas: ni JourneyMap ni Diorama van dentro del jar
	maven {
		name = "JourneyMap"
		url = "https://maven.blamejared.com"
		content { includeGroup "info.journeymap" }
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly "info.journeymap:journeymap-api-fabric:${project.journeymap_api_version}"
	modCompileOnly "maven.modrinth:diorama-map:${project.diorama_version}"
}

// El datapack y los idiomas los genera datapack/build.py --mod (lo hace la CI antes de compilar)
sourceSets.main.resources.srcDir 'src/main/generated'

// Para herramientas/servidor_prueba.py: los comandos de consola llegan al servidor por stdin
tasks.named('runServer') {
	standardInput = System.in
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
