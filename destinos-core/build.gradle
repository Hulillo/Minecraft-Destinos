plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

// Para distinguir un jar de otro: en la CI se añade el número de compilación (0.5.3+build.263); al compilar en local,
// la rama y el commit (0.5.3+embajada.53edf17). Sin git, la versión tal cual.
def git(String... args) {
	try {
		def p = (["git"] + args.toList()).execute(null, rootDir)
		def out = p.text.trim()
		return p.waitFor() == 0 && out ? out : null
	} catch (Exception e) {
		return null
	}
}
if (System.getenv("GITHUB_RUN_NUMBER")) {
	version = "${project.version}+build.${System.getenv("GITHUB_RUN_NUMBER")}"
} else {
	def rama = git("rev-parse", "--abbrev-ref", "HEAD")
	def commit = git("rev-parse", "--short", "HEAD")
	if (rama && commit) {
		// solo letras, números y puntos en la parte de build (destinos-core/embajada → embajada)
		def corta = rama.tokenize("/").last().replaceAll("[^A-Za-z0-9]", "")
		version = "${project.version}+${corta}.${commit}"
	} else {
		version = project.version
	}
}
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Solo para compilar los enchufes de mapas: ni JourneyMap ni Diorama van dentro del jar
	maven {
		name = "JourneyMap"
		url = "https://maven.blamejared.com"
		content { includeGroup "info.journeymap" }
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly "info.journeymap:journeymap-api-fabric:${project.journeymap_api_version}"
	modCompileOnly "maven.modrinth:diorama-map:${project.diorama_version}"
}

// El datapack y los idiomas los genera datapack/build.py --mod (lo hace la CI antes de compilar)
sourceSets.main.resources.srcDir 'src/main/generated'

// Para herramientas/servidor_prueba.py: los comandos de consola llegan al servidor por stdin
tasks.named('runServer') {
	standardInput = System.in
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
